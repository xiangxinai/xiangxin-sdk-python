[project]
name = "xiangxin-sdk"
version = "0.3.1"
description = "象信 AI 官方 Python SDK —— 调用系统一模型象信（System One API）"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "象信AI", email = "wanglei@xiangxinai.cn" }]
keywords = ["xiangxin", "system-one", "classification", "llm", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://xiangxinai.cn"
Documentation = "https://docs.xiangxinai.cn/sdk/python"
Console = "https://console.xiangxinai.cn"
Repository = "https://github.com/xiangxinai/xiangxin-sdk-python"
Issues = "https://github.com/xiangxinai/xiangxin-sdk-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiangxin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
