# 推送 v* 标签即发布到 PyPI（Trusted Publishing / OIDC，仓库里不存任何令牌）。
#   git tag v0.1.1 && git push origin v0.1.1
# 首次使用前需在 PyPI 项目 xiangxin-sdk → Publishing 里添加 GitHub 发布者：
#   owner=xiangxinai  repo=xiangxin-sdk-python  workflow=release.yml  environment=pypi
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 标签必须与包版本一致
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          iv=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/xiangxin/_version.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" && test "$v" = "$iv" || { echo "tag $GITHUB_REF_NAME != pyproject $v / _version $iv"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xiangxin-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 用 CHANGELOG 对应段落创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
